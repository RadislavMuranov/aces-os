name: CI

on:
  push:
    branches:
      - main
      - "implementation/**"
  pull_request:

jobs:
  test:
    name: Node.js test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Show environment
        run: |
          node --version
          npm --version

      - name: Run test suite (node --test)
        run: node --test tests/*.test.ts
